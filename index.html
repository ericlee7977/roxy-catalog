<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roxy 产品查询</title>
<style>
:root { --bg:#eef2d8; --card:#fff; --ink:#1a1a1a; --muted:#666; --brand:#1f4e3d; --gold:#f2c14e; }
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);}
header{position:sticky;top:0;z-index:6;background:var(--brand);color:#fff;padding:12px 16px 14px;padding-top:max(12px,env(safe-area-inset-top));}
header h1{margin:0 0 8px;font-size:16px;font-weight:700;}
.search{display:flex;gap:8px}
.search input{flex:1;border:0;border-radius:10px;padding:10px 12px;font-size:16px;}
.search button{border:0;background:var(--gold);color:#222;font-weight:700;border-radius:10px;padding:10px 14px;font-size:14px}
.meta{padding:10px 16px 0;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:420px;margin:0 auto;}
.meta button{border:0;background:transparent;color:var(--brand);font-size:13px;font-weight:700;}
.list{padding:12px 12px 110px;display:grid;gap:16px;max-width:420px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px 14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.08);text-align:center;position:relative;}
.card.picked{outline:3px solid var(--brand);}
.pick{position:absolute;top:10px;left:10px;width:28px;height:28px;accent-color:var(--brand);}
.card img.prod{display:block;width:100%;height:auto;min-height:200px;max-height:360px;object-fit:contain;background:#f7f7f2;border-radius:10px;}
.name{font-size:15px;font-weight:700;color:#222;margin:10px 0 6px;line-height:1.35;}
.sku{font-size:22px;font-weight:800;margin:0 0 2px;}
.pack{font-size:14px;color:#555;margin:0 0 10px;}
.card img.bc{display:block;width:100%;max-height:90px;object-fit:contain;margin:0 auto;}
.empty{text-align:center;padding:40px 20px;color:#555}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-top:1px solid #ddd;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center;}
.bar span{font-size:14px;font-weight:700;min-width:72px;}
.bar button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;font-size:15px;}
.bar .share{background:var(--brand);color:#fff;}
.bar .clear{background:#eee;color:#333;}
.sharebox{max-width:420px;margin:12px auto 130px;background:#fff;border-radius:12px;padding:12px;display:none;position:relative;z-index:9;}
.sharebox textarea{width:100%;min-height:120px;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:14px;}
#syncbox input,#syncbox button{position:relative;z-index:9;}
.note{margin-top:8px;width:100%;border:1px dashed #c5c9a8;border-radius:8px;padding:8px;font-size:13px;resize:vertical;min-height:36px;background:#fafaf3;}
.quote{margin-top:8px;text-align:left;background:#fafaf3;border:1px dashed #c5c9a8;border-radius:8px;padding:8px;}
.quote .row{display:flex;gap:6px;margin:0 0 6px;align-items:center;}
.quote label{font-size:12px;color:#555;width:84px;flex:0 0 84px;}
.quote input{flex:1;border:1px solid #ddd;border-radius:6px;padding:6px 8px;font-size:13px;min-width:0;}
.quote .hint{font-size:12px;color:#1f4e3d;line-height:1.4;}
.quote .warn{color:#8a4b08;}

body.guest header .search, body.guest .meta, body.guest .bar, body.guest .note, body.guest .quote, body.guest .pick, body.guest .sharebox, body.guest #syncbox{display:none !important;}
body.guest .list{padding-bottom:24px;}
body.guest header h1{margin:0;}

</style>
</head>
<body>
<header>
  <h1>Roxy Trading 产品查询</h1>
  <form class="search" id="f">
    <input id="q" type="search" placeholder="SKU / 芒果 / fishball / lemon" autofocus>
    <button type="submit">搜索</button>
  </form>
</header>
<div class="meta">
  <span id="meta">准备搜索</span>
  <span>
    <button type="button" id="selAll">全选本页</button>
    <button type="button" id="expNotes">备份备注</button>
    <button type="button" id="impNotes">恢复备注</button>
    <button type="button" id="syncBtn">云同步</button>
    <input id="impFile" type="file" accept="application/json,.json" hidden>
  </span>
</div>
<div class="list" id="list"></div>
<div class="sharebox" id="sharebox">
  <textarea id="sharetext" readonly></textarea>
</div>
<div class="sharebox" id="syncbox">
  <p style="margin:0 0 8px;font-size:13px;color:#444">把 GitHub Token 和 Gist ID 填在这里，备注会自动存到你的私密 Gist。不要发给客户，也不要提交到公开仓库。</p>
  <input id="syncToken" type="password" placeholder="GitHub Token（gist 权限）" style="width:100%;margin:0 0 8px;padding:8px;border:1px solid #ddd;border-radius:8px;">
  <input id="syncGist" type="text" placeholder="Gist ID" style="width:100%;margin:0 0 8px;padding:8px;border:1px solid #ddd;border-radius:8px;">
  <button type="button" id="syncSave" style="border:0;background:#1f4e3d;color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;">保存并立即同步</button>
  <div id="syncMsg" style="margin-top:8px;font-size:12px;color:#666"></div>
</div>
<div class="bar">
  <span id="cnt">已选 0</span>
  <button class="clear" type="button" id="clear">取消选择</button>
  <button class="share" type="button" id="share">分享选中</button>
</div>

const selected = new Set();
const notes = JSON.parse(localStorage.getItem('roxy_notes')||'{}');
const quotes = JSON.parse(localStorage.getItem('roxy_quotes')||'{}');
function saveQuotes(){ localStorage.setItem('roxy_quotes', JSON.stringify(quotes)); queueCloudSave(); }
function saveNotes(){
  localStorage.setItem('roxy_notes', JSON.stringify(notes));
  queueCloudSave();
}
const syncCfg = JSON.parse(localStorage.getItem('roxy_sync')||'{}');
let cloudTimer = null;
function queueCloudSave(){
  if(!syncCfg.token || !syncCfg.gistId) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(pushCloud, 800);
}
async function pushCloud(){
  if(!syncCfg.token || !syncCfg.gistId) return;
  const msg = document.getElementById('syncMsg');
  try{
    const res = await fetch('https://api.github.com/gists/' + syncCfg.gistId, {
      method: 'PATCH',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + syncCfg.token
      },
      body: JSON.stringify({
        files: { 'roxy-notes.json': { content: JSON.stringify({notes:notes, quotes:quotes}, null, 2) } }
      })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    if(msg) msg.textContent = '已同步到云端 ' + new Date().toLocaleTimeString();
  }catch(err){
    if(msg) msg.textContent = '同步失败：' + err.message;
  }
}
async function pullCloud(){
  if(!syncCfg.token || !syncCfg.gistId) return;
  try{
    const res = await fetch('https://api.github.com/gists/' + syncCfg.gistId, {
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + syncCfg.token
      }
    });
    if(!res.ok) return;
    const data = await res.json();
    const file = data.files && (data.files['roxy-notes.json'] || Object.values(data.files||{})[0]);
    if(!file || !file.content) return;
    const remote = JSON.parse(file.content);
    if(remote && remote.notes){
      Object.assign(notes, remote.notes);
      if(remote.quotes) Object.assign(quotes, remote.quotes);
    }else{
      Object.assign(notes, remote);
    }
    localStorage.setItem('roxy_notes', JSON.stringify(notes));
    localStorage.setItem('roxy_quotes', JSON.stringify(quotes));
  }catch(err){}
}
document.getElementById('syncBtn').onclick = ()=>{
  const box = document.getElementById('syncbox');
  const open = box.style.display !== 'block';
  box.style.display = open ? 'block' : 'none';
  if(open){
    document.getElementById('syncToken').value = syncCfg.token || '';
    document.getElementById('syncGist').value = syncCfg.gistId || '';
    box.scrollIntoView({behavior:'smooth', block:'center'});
  }
};
document.getElementById('syncSave').onclick = async ()=>{
  syncCfg.token = document.getElementById('syncToken').value.trim();
  syncCfg.gistId = document.getElementById('syncGist').value.trim();
  localStorage.setItem('roxy_sync', JSON.stringify(syncCfg));
  document.getElementById('syncMsg').textContent = '正在同步…';
  await pushCloud();
};
pullCloud();
document.getElementById('expNotes').onclick = ()=>{
  const blob = new Blob([JSON.stringify({notes:notes, quotes:quotes}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'roxy-notes.json';
  a.click();
};
document.getElementById('impNotes').onclick = ()=> document.getElementById('impFile').click();
document.getElementById('impFile').onchange = (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object') throw new Error('格式不对');
      if(data.notes){ Object.assign(notes, data.notes); if(data.quotes) Object.assign(quotes, data.quotes); }
      else { Object.assign(notes, data); }
      saveNotes(); saveQuotes();
      alert('备注已恢复：' + Object.keys(notes).length + ' 条');
      const q = document.getElementById('q').value.trim();
      if(!new URLSearchParams(location.search).has('skus')) render(q);
    }catch(err){ alert('无法读取备注文件'); }
  };
  reader.readAsText(file);
};

if(isGuest) document.body.classList.add('guest');

  if(ALIASES[t]) String(ALIASES[t]).split(/[,|，]/).forEach(addPhrase);
  const c = compact(t);
  for(const [k,v] of Object.entries(ALIASES)){
    const ck = compact(k);
    if(k===t || ck===c){
      String(v).split(/[,|，]/).forEach(addPhrase);
      addPhrase(k);
    }
  }
  return [...out].filter(x=>x && (x.length>=2 || /[\u4e00-\u9fff]/.test(x)));
}
function fields(p){
  return {
    name: compact([p.name,p.name_en,p.name_zh].join(' ')),
    rawName: ((p.name||'')+' '+(p.name_en||'')+' '+(p.name_zh||'')).toLowerCase(),
    all: compact([p.search,p.sku,p.name,p.name_en,p.name_zh,p.pack,p.barcode].join(' ')),
    rawAll: (p.search||'').toLowerCase()
  };
}
function hit(textCompact, textRaw, alts){
  return alts.some(a => textCompact.includes(compact(a)) || textRaw.includes(a));
}
function photo(p){return p.image_thumb || p.image || '';}
function score(p, rawTokens, groups, qCompact){
  const f = fields(p);
  let s = 0;
  if(qCompact && f.name.includes(qCompact)) s += 100;
  if(qCompact && f.all.includes(qCompact)) s += 40;
  groups.forEach((alts,i)=>{
    if(hit(f.name, f.rawName, alts)) s += 30;
    else if(hit(f.all, f.rawAll, alts)) s += 8;
    const tok = rawTokens[i];
    if(f.rawName.includes(tok) || f.name.includes(compact(tok))) s += 20;
  });
  return s;
}
function search(query){
  const raw = tokens(query);
  if(!raw.length) return PRODUCTS.slice(0,20);
  const groups = raw.map(expandToken);
  const qCompact = compact(query);
  const rows = PRODUCTS.filter(p=>{
    const f = fields(p);
    return groups.every(alts => hit(f.name, f.rawName, alts) || hit(f.all, f.rawAll, alts));
  }).map(p=>({p,s:score(p, raw, groups, qCompact)}));
  rows.sort((a,b)=>b.s-a.s);
  // drop weak leftovers: must match in the product name, not only pack/barcode soup
  const strong = rows.filter(x=> groups.every(alts => hit(fields(x.p).name, fields(x.p).rawName, alts)));
  return (strong.length?strong:rows).map(x=>x.p);
}
function parsePromo(s){
  const t = String(s||'').replace(/\s+/g,'');
  const m = t.match(/(?:买|買)?(\d+)\s*(?:送|赠|贈)\s*(\d+)/);
  if(!m) return null;
  return {pay:+m[1], free:+m[2], get:+m[1]+ +m[2]};
}
function money(n){ return (Math.round(n*100)/100).toFixed(2); }
function suggestPromoUnit(unit, pay, get){
  // find smallest unit' >= unit (to the cent) such that pay*unit'/get is exact cents
  const start = Math.round(unit*100);
  for(let c=start; c<=start+5000; c++){
    const total = pay * c;
    if(total % get === 0) return c/100;
  }
  return null;
}
function quoteHTML(sku){
  const q = quotes[sku] || {unit:'', promoUnit:'', promo:''};
  const parsed = parsePromo(q.promo);
  let hint = '';
  if(q.promoUnit && parsed){
    const pu = parseFloat(q.promoUnit);
    if(!isNaN(pu) && pu>0){
      const total = pu * parsed.pay;
      const each = total / parsed.get;
      const exact = Math.abs(each*100 - Math.round(each*100)) < 1e-6;
      if(exact){
        hint = `<div class="hint">付 ${parsed.pay} 件 / 拿 ${parsed.get} 件 · 活动总额 $${money(total)} · 折算 $${money(each)}/件</div>`;
      }else{
        const sug = suggestPromoUnit(pu, parsed.pay, parsed.get);
        hint = `<div class="hint warn">$${money(each)}/件 除不尽。建议活动件单价 $${money(sug)}（总额 $${money(sug*parsed.pay)}，折算 $${money(sug*parsed.pay/parsed.get)}/件）</div>`;
      }
    }
  }else if(q.promo && !parsed){
    hint = `<div class="hint warn">活动请写成 10送1、30送3</div>`;
  }
  return `<div class="quote" data-sku="${esc(sku)}">
    <div class="row"><label>散买单价</label><input class="q-unit" inputmode="decimal" placeholder="例如 10.00" value="${esc(q.unit||'')}"></div>
    <div class="row"><label>活动件单价</label><input class="q-promo-unit" inputmode="decimal" placeholder="例如 9.50" value="${esc(q.promoUnit||'')}"></div>
    <div class="row"><label>活动</label><input class="q-promo" placeholder="例如 10送1 或 30送3" value="${esc(q.promo||'')}"></div>
    ${hint}
  </div>`;
}
function card(p){
  const title = p.name || p.name_en || '';
  const checked = selected.has(p.sku) ? 'checked' : '';
  const picked = selected.has(p.sku) ? ' picked' : '';
  const bc = p.barcode_image || '';
  return `<article class="card${picked}" data-sku="${esc(p.sku)}">
    <input class="pick" type="checkbox" ${checked} data-sku="${esc(p.sku)}" aria-label="选择">
    <img class="prod" src="${esc(photo(p))}" alt="${esc(title)}" referrerpolicy="no-referrer" loading="lazy">
    <div class="name">${esc(title)}</div>
    <div class="sku">${esc(p.sku||'')}</div>
    <div class="pack">${esc(p.pack||'')}</div>
    ${bc?`<img class="bc" src="${esc(bc)}" alt="barcode" referrerpolicy="no-referrer">`:''}
    <textarea class="note" data-sku="${esc(p.sku)}" placeholder="仅自己可见的备注" rows="2">${esc(notes[p.sku]||'')}</textarea>
    ${quoteHTML(p.sku)}
  </article>`;
}
function render(query){
  const rows = search(query);
  $meta.textContent = query ? `“${query}” 找到 ${rows.length} 个产品` : `共 ${PRODUCTS.length} 个产品`;
  if(!rows.length){
    $list.innerHTML = `<div class="empty">没有找到匹配“${esc(query)}”的产品。</div>`;
    return;
  }
  $list.innerHTML = rows.slice(0,80).map(card).join('');
}
function updateCnt(){ $cnt.textContent = '已选 ' + selected.size; }
function selectedProducts(){
  return PRODUCTS.filter(p=>selected.has(p.sku));
}
function sharePayload(){
  const rows = selectedProducts();
  const skus = rows.map(p=>p.sku).join(',');
  const url = location.origin + location.pathname.replace(/index\.html$/,'') + '?skus=' + encodeURIComponent(skus);
  const lines = rows.map(p => `${p.name}\nSKU ${p.sku}${p.pack?'  '+p.pack:''}`).join('\n\n');
  return {url, text: 'Roxy 产品清单\n\n' + lines + '\n\n查看产品图片：\n' + url, rows};
}

$list.addEventListener('input', e=>{
  const ta = e.target.closest('.note');
  if(ta){
    const sku = ta.getAttribute('data-sku');
    notes[sku] = ta.value;
    if(!ta.value) delete notes[sku];
    saveNotes();
    return;
  }
  const box = e.target.closest('.quote');
  if(!box) return;
  const sku = box.getAttribute('data-sku');
  quotes[sku] = {
    unit: box.querySelector('.q-unit').value.trim(),
    promoUnit: box.querySelector('.q-promo-unit').value.trim(),
    promo: box.querySelector('.q-promo').value.trim()
  };
  if(!quotes[sku].unit && !quotes[sku].promoUnit && !quotes[sku].promo) delete quotes[sku];
  saveQuotes();
  const art = box.closest('.card');
  if(art){
    const hold = {
      note: art.querySelector('.note')?.value,
      unit: box.querySelector('.q-unit').value,
      promoUnit: box.querySelector('.q-promo-unit').value,
      promo: box.querySelector('.q-promo').value,
      focus: document.activeElement.className,
      start: document.activeElement.selectionStart
    };
    const p = PRODUCTS.find(x=>x.sku===sku);
    if(!p) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = card(p);
    art.replaceWith(wrap.firstElementChild);
    const neu = $list.querySelector('.card[data-sku="'+sku+'"]');
    if(neu){
      const map = {note:'.note','q-unit':'.q-unit','q-promo-unit':'.q-promo-unit','q-promo':'.q-promo'};
      const sel = hold.focus && hold.focus.includes('q-promo-unit') ? '.q-promo-unit' : hold.focus && hold.focus.includes('q-promo') && !hold.focus.includes('unit') ? '.q-promo' : hold.focus && hold.focus.includes('q-unit') ? '.q-unit' : hold.focus && hold.focus.includes('note') ? '.note' : null;
      if(sel){
        const el = neu.querySelector(sel);
        if(el){ el.focus(); try{ el.setSelectionRange(hold.start, hold.start);}catch(e){} }
      }
    }
  }
});
$list.addEventListener('change', e=>{
  const box = e.target.closest('.pick');
  if(!box) return;
  const sku = box.getAttribute('data-sku');
  if(box.checked) selected.add(sku); else selected.delete(sku);
  const cardEl = box.closest('.card');
  if(cardEl) cardEl.classList.toggle('picked', box.checked);
  updateCnt();
});
document.getElementById('selAll').onclick = ()=>{
  $list.querySelectorAll('.pick').forEach(box=>{
    box.checked = true;
    selected.add(box.getAttribute('data-sku'));
    box.closest('.card')?.classList.add('picked');
  });
  updateCnt();
};
document.getElementById('clear').onclick = ()=>{
  selected.clear();
  $list.querySelectorAll('.pick').forEach(box=>{
    box.checked = false;
    box.closest('.card')?.classList.remove('picked');
  });
  updateCnt();
};
document.getElementById('share').onclick = async ()=>{
  if(!selected.size){ alert('请先勾选要分享的产品'); return; }
  const {url, text} = sharePayload();
  const box = document.getElementById('sharebox');
  const ta = document.getElementById('sharetext');
  ta.value = text;
  box.style.display = 'block';
  if(navigator.share){
    try{ await navigator.share({title:'Roxy 产品', text, url}); return; }catch(e){}
  }
  try{
    await navigator.clipboard.writeText(text);
    alert('已复制清单，可直接粘贴到微信/WhatsApp');
  }catch(e){
    ta.focus(); ta.select();
    alert('请长按文本框复制后发给客户');
  }
};

$f.addEventListener('submit', e=>{
  e.preventDefault();
  const query = $q.value.trim();
  const url = new URL(location.href);
  url.searchParams.delete('skus');
  if(query) url.searchParams.set('q', query); else url.searchParams.delete('q');
  history.replaceState(null,'', url);
  render(query);
});

const params = new URLSearchParams(location.search);
const initQ = params.get('q') || '';
const initSkus = (params.get('skus')||'').split(',').map(s=>s.trim()).filter(Boolean);
$q.value = initQ;
if(initSkus.length){
  document.querySelector('header h1').textContent = 'Roxy Trading 产品';
  const rows = PRODUCTS.filter(p=>initSkus.includes(p.sku));
  $list.innerHTML = rows.map(card).join('');
}else{
  render(initQ);
}
updateCnt();
</script>
</body>
